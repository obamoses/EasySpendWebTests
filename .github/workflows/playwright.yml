name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
          BASE_URL:          ${{ secrets.BASE_URL }}
          USER_EMAIL:        ${{ secrets.USER_EMAIL }}
          USER_PASSWORD:     ${{ secrets.USER_PASSWORD }}
          USER_PIN:          ${{ secrets.USER_PIN }}
          INVALID_EMAIL:     ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD:  ${{ secrets.INVALID_PASSWORD }}
          # Paste the full contents of credentials.json as a single-line JSON string
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          # Paste the full contents of token.json as a single-line JSON string
          GMAIL_TOKEN:       ${{ secrets.GMAIL_TOKEN }}
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
